  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,200,1,0"
/>

<div class="stage" id="stage">
  <div class="alert" id="alert">
    <div class="alert-icon-wrap">
      <span id="alertIcon" class="material-symbols-sharp alert-icon" aria-hidden="true"></span>
    </div>
    <div class="alert-body">
      <div class="alert-line1" id="alertLine1"></div>
      <div class="alert-line2" id="alertLine2"></div>
      <div class="alert-name" id="alertName"></div>
      <div class="alert-message" id="alertMessage"></div>
    </div>
  </div>
</div>

<audio id="alertSound" preload="auto"></audio>
