<link id="googleFontLink" rel="stylesheet" href="" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,200,1,0"
/>

<div class="player is-hidden is-initial" id="player">
  <div class="player-progress" id="progressWindow">
    <div class="player-fill" id="fill"></div>
  </div>

  <div class="player-info">
    <div class="player-cover" id="coverWrap">
      <img class="player-cover-img" id="cover" alt="" />
      <span class="material-symbols-sharp player-cover-fallback" aria-hidden="true">music_note</span>
    </div>

    <div class="player-body">
      <div class="player-line">
        <span class="player-scroll" id="trackLine"><span class="player-title" id="title"></span><span class="player-sep" id="sep">·</span><span class="player-artist" id="artist"></span></span>
      </div>
    </div>

    <div class="player-error" id="error"></div>
  </div>
</div>
