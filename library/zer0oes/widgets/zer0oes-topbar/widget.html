<link id="googleFontLink" rel="stylesheet" href="" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,200,1,0"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<div id="topbar" class="topbar">
  <div id="textRow" class="text-row">
    <div id="zoneDate" class="zone zone-date">
      <div class="date-row">
        <span class="material-symbols-sharp icon" aria-hidden="true">event</span>
        <div id="date"></div>
      </div>
    </div>

    <div id="zoneLabels" class="zone zone-labels">
      <div class="labels-row">
        <span class="label">
          <span id="icoFollow" class="material-symbols-sharp icon" aria-hidden="true">heart_plus</span>
          <span class="txt" id="lblFollow"></span>
        </span>

        <span class="label">
          <span id="icoSub" class="material-symbols-sharp icon" aria-hidden="true">star_shine</span>
          <span class="txt" id="lblSub"></span>
        </span>

        <span class="label">
          <span id="icoCheer" class="material-symbols-sharp icon" aria-hidden="true">diamond_shine</span>
          <span class="txt" id="lblCheer"></span>
        </span>

        <span class="label">
          <span id="icoTip" class="material-symbols-sharp icon" aria-hidden="true">money_bag</span>
          <span class="txt" id="lblTip"></span>
        </span>
      </div>
    </div>

    <div id="zoneSocial" class="zone zone-social">
      <div id="socials"></div>
    </div>
  </div>

  <div id="borderBar" class="line-widget">
    <div class="dot"></div>
    <div class="line"></div>
    <div class="dot"></div>
  </div>
</div>
