<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Clarity+City:wght@400;500;600;700&amp;display=swap">

<section class="music-slot" id="music" aria-label="Musique en cours">
  <header class="music-heading">
    <span class="music-note" aria-hidden="true">♫</span>
    <span id="musicTitle"></span>
  </header>
  <div class="music-track" id="track" hidden>
    <div class="music-cover" id="coverWrap">
      <img class="music-cover-img" id="cover" alt="" />
      <span class="music-cover-fallback" aria-hidden="true">♪</span>
    </div>
    <div class="music-info">
      <div class="music-title" id="title"></div>
      <div class="music-artist" id="artist"></div>
    </div>
  </div>
  <div class="music-state" id="state" hidden></div>
</section>
