<link id="googleFontLink" rel="stylesheet" href="" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,200,1,0"
/>

<div class="goal" id="goal">
  <div class="goal-left">
    <div class="goal-fill" id="fill"></div>

    <div class="goal-label">
      <div class="goal-icon">
        <span id="goalIcon" class="material-symbols-sharp icon" aria-hidden="true"></span>
      </div>
      <div class="goal-title" id="title"></div>
    </div>
  </div>

  <div class="goal-right" id="goalRight">
    <span id="current"></span>
    <span class="sep">/</span>
    <span id="target"></span>
  </div>
</div>
